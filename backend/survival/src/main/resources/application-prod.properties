server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:h2:mem:operation-survival-prod;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# In production profile, APP_JWT_SECRET must be provided.
app.jwt.secret=${APP_JWT_SECRET:OperationSurvivalRenderSecretKey-ReplaceInProd-1234567890}

# Allow Vercel and local dev origins by default. Override in deployment as needed.
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app,http://localhost:*,http://127.0.0.1:*,https://*.ngrok-free.app,https://*.ngrok.app}