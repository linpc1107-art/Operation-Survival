services:
  mysql:
    image: mysql:8.4
    container_name: operation-survival-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: survival
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Taipei
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data: